name: lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install zsh
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zsh

      - name: shellcheck (bash and sh scripts)
        # ranger's scope.sh is upstream's template, not ours to lint
        run: |
          files=$(grep -rlE '^#!.*\b(bash|sh)\b' --exclude-dir=.git . | grep -v -e '\.zsh$' -e '^./ranger/')
          echo "$files"
          shellcheck $files

      - name: zsh syntax
        run: |
          for f in zsh/.zshrc zsh/.zshenv zsh/.p10k.zsh; do
            echo "$f"; zsh -n "$f"
          done

      - name: JSON
        run: |
          for f in $(find . -name '*.json' -not -path './.git/*'); do
            echo "$f"; jq empty "$f"
          done

      - name: Brewfile syntax
        run: ruby -c Brewfile && ruby -c Brewfile.minimal
